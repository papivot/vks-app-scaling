# Online Boutique via Official Google Helm Chart
# Deployed via Flux CD HelmRelease with helm-controller
# Chart: https://github.com/GoogleCloudPlatform/microservices-demo/tree/main/helm-chart
# OCI Registry: oci://us-docker.pkg.dev/online-boutique-ci/charts/onlineboutique
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: online-boutique
  namespace: online-boutique
spec:
  interval: 5m
  chart:
    spec:
      chart: onlineboutique
      version: "0.10.5"
      sourceRef:
        kind: HelmRepository
        name: online-boutique-official
        namespace: online-boutique
  install:
    crds: Create
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    images:
      repository: us-central1-docker.pkg.dev/google-samples/microservices-demo
    serviceAccounts:
      create: true
      annotations: {}
    networkPolicies:
      create: false
    sidecars:
      create: false
    authorizationPolicies:
      create: false
    securityContext:
      enable: true
    adService:
      create: true
      resources:
        requests:
          cpu: 200m
          memory: 180Mi
        limits:
          cpu: 300m
          memory: 300Mi
    cartService:
      create: true
      resources:
        requests:
          cpu: 200m
          memory: 128Mi
        limits:
          cpu: 300m
          memory: 256Mi
    checkoutService:
      create: true
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
    currencyService:
      create: true
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
    emailService:
      create: true
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
    frontend:
      create: true
      externalService: false
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
    loadGenerator:
      create: true
      resources:
        requests:
          cpu: 300m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
    paymentService:
      create: true
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
    productCatalogService:
      create: true
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
    recommendationService:
      create: true
      resources:
        requests:
          cpu: 100m
          memory: 220Mi
        limits:
          cpu: 200m
          memory: 450Mi
    shippingService:
      create: true
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
    cartDatabase:
      type: redis
      connectionString: "redis-cart:6379"
      inClusterRedis:
        create: true
        publicRepository: true
---
# HelmRepository for Online Boutique OCI Chart
# Note: Current helm-controller may not fully support OCI repositories
# For helm-controller with OCI, consider using GitRepository or 
# deploying via Helm CLI directly as shown above
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: online-boutique-official
  namespace: online-boutique
spec:
  interval: 5m
  type: oci
  url: oci://us-docker.pkg.dev/online-boutique-ci/charts
