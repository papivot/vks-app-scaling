# ============================================================
# redis-cart - mode: Initial only (stateful; no live resizing)
# Initial mode sets correct requests on first pod creation only.
# ============================================================
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: vpa-redis-cart
  namespace: online-boutique
  labels:
    app: redis-cart
    vpa-role: initial
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: redis-cart
  updatePolicy:
    updateMode: "Initial"
  resourcePolicy:
    containerPolicies:
    - containerName: redis
      minAllowed:
        cpu: 50m
        memory: 128Mi
      maxAllowed:
        cpu: 500m
        memory: 1Gi
      controlledResources: ["cpu", "memory"]
      controlledValues: RequestsAndLimits
