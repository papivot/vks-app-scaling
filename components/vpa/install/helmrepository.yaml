# VPA via Kubernetes/Autoscaler Helm Chart (official maintained)
# Deployed via HelmRepository + HelmRelease in kube-system namespace
# Reference: https://github.com/kubernetes/autoscaler/blob/master/vertical-pod-autoscaler/charts/vertical-pod-autoscaler/values.yaml
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: autoscalers
  namespace: kube-system
spec:
  interval: 5m
  url: https://kubernetes.github.io/autoscaler
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vpa
  namespace: kube-system
spec:
  interval: 5m
  chart:
    spec:
      chart: vertical-pod-autoscaler
      sourceRef:
        kind: HelmRepository
        name: autoscalers
        namespace: kube-system
      version: 0.9.0
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    rbac:
      create: true
    admissionController:
      enabled: true
      replicas: 1
      priorityClassName: system-cluster-critical
      registerWebhook: false
      certGen:
        enabled: true
      tls:
        create: true
    recommender:
      enabled: true
      replicas: 1
      priorityClassName: system-cluster-critical
    updater:
      enabled: true
      replicas: 1
      priorityClassName: system-cluster-critical
      extraArgs:
        - --in-place-skip-disruption-budget=true